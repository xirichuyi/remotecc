<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>RemoteCC</title><link rel="stylesheet" href="style.css"></head><body>
<aside>
<div class="window-handle"></div><div class="brand"><strong>RemoteCC</strong></div>
<button id="new-chat" class="new-chat">＋ 新对话 <kbd>⌘ N</kbd></button>
<div class="search-wrap"><input id="search" placeholder="搜索" aria-label="搜索对话"></div>
<div class="session-filters"><button id="active-chats" class="selected">对话</button><button id="archived-chats">已归档</button></div><div class="history-toolbar"><span id="history-status"></span><button id="refresh-history" title="刷新远端历史">刷新历史</button></div><div class="section-label">项目 <span id="chat-count">0</span></div><nav id="chat-list" aria-label="项目与对话列表"></nav>
<div class="sidebar-bottom"><div class="server-row"><strong id="sidebar-host">axi</strong><span id="ssh-status">未连接</span></div><div class="server-actions"><button id="connect-server">连接 SSH</button><button id="disconnect-server" hidden>断开</button><button id="connection-settings" title="SSH 设置" aria-label="SSH 设置">设置</button></div></div>
</aside>
<main>
<header><div class="header-title"><span id="chat-title">新对话</span><span class="header-separator">/</span><span id="header-host">axi</span></div><div class="header-actions"><span id="connection-status">就绪</span><button id="rename-chat" class="icon-button" title="重命名对话" aria-label="重命名对话" hidden>重命名</button><button id="delete-chat" class="icon-button" title="删除对话" aria-label="删除对话" hidden>删除</button><button id="session-tools" class="icon-button">会话</button><button id="toggle-files" class="icon-button">文件</button></div></header>
<div id="scroll-area"><section id="welcome"><h1>新对话</h1><p id="welcome-path">axi · ~</p></section><div id="history-notice" hidden></div><div id="messages" aria-live="polite" aria-relevant="additions text"></div></div>
<div class="composer-region"><div id="permissions"></div><div id="queued-messages"></div><div id="mention-menu" role="listbox" hidden></div><div id="command-menu" role="listbox" hidden></div><form id="composer"><div id="attachments"></div><textarea id="prompt" rows="2" placeholder="发送消息…" aria-label="消息" aria-autocomplete="list" aria-controls="command-menu" aria-expanded="false" maxlength="200000"></textarea><div class="composer-toolbar"><div class="composer-left"><button type="button" id="upload-attachment" title="上传文件并附加" aria-label="上传附件">＋</button><div class="workspace-chip"><span id="workspace-label">axi</span><span class="chip-separator">/</span><span id="workspace-directory">~</span></div></div><div class="send-controls"><button type="button" id="mode-label" class="composer-setting">默认权限</button><button type="button" id="model-label" class="composer-setting">Claude ▾</button><button type="submit" id="send-message" aria-label="发送消息" title="发送消息">↑</button><button type="button" id="stop-message" aria-label="停止生成" title="停止生成" hidden>■</button></div></div></form><div class="composer-footnote"><span id="activity-text">Enter 发送 · Shift + Enter 换行</span><span id="transfer-status"></span></div></div>
</main>
<section id="file-panel"><div class="file-header"><strong>文件</strong><button id="refresh-files" title="刷新目录">刷新</button></div><form id="path-form"><button id="parent-folder" type="button" title="上一级">↑</button><input id="file-path" value="~" aria-label="远端目录" spellcheck="false"><button type="submit" title="打开目录">↵</button></form><div class="file-toolbar"><button id="use-folder">设为工作目录</button><button id="upload-files">上传</button><label><input type="checkbox" id="show-hidden"> 隐藏文件</label></div><div id="file-error" role="alert"></div><div id="file-list"><div class="file-empty">未连接 SSH</div></div><div id="file-footer"></div></section>
<dialog id="connection-dialog"><form id="connection-form"><h2>SSH 连接</h2><label>主机 / SSH 别名<input name="host" value="axi" required placeholder="ssh axi 或 user@host" spellcheck="false"></label><label>端口<input name="port" type="number" min="1" max="65535" placeholder="使用 SSH 配置"></label><label>初始目录<input name="directory" value="~" required spellcheck="false"></label><div class="form-note">使用本机 ~/.ssh/config、密钥和 SSH agent。</div><div id="connection-error" class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" id="cancel-connection">取消</button><button type="submit" class="accent-button">连接</button></div></form></dialog>
<dialog id="rename-dialog"><form id="rename-form"><h2>重命名对话</h2><label>名称<input id="rename-input" required maxlength="80"></label><div class="dialog-actions"><button id="cancel-rename" type="button">取消</button><button type="submit" class="accent-button">保存</button></div></form></dialog>
<dialog id="preview-dialog"><div class="preview-header"><div><strong id="preview-name"></strong><div id="preview-path"></div></div><button id="close-preview" aria-label="关闭预览">×</button></div><div class="preview-actions"><button id="edit-preview" hidden>编辑</button><button id="save-preview" hidden>保存到远端</button><button id="attach-preview">附加到消息</button><button id="download-preview">下载</button><button id="open-preview" title="下载副本后使用本机软件打开">本地打开</button><span id="preview-info"></span></div><div id="preview-content"></div></dialog>
<dialog id="control-dialog"><div class="control-heading"><h2 id="control-title"></h2><button id="close-control" aria-label="关闭面板">×</button></div><div id="control-content"></div></dialog><div id="toast" role="alert" hidden></div><script src="../node_modules/marked/lib/marked.umd.js"></script><script src="../node_modules/dompurify/dist/purify.min.js"></script><script src="interaction-schema.js"></script><script src="interaction-ui.js"></script><script src="renderer.js"></script><script src="workspace.js"></script><script src="command-completion.js"></script><script src="controls.js"></script><script src="input-features.js"></script><script src="history-ui.js"></script></body></html>
